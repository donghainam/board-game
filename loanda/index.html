<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loạn Đả Viễn Tây</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤠</text></svg>">
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="../shared/cards.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  .seats2 { display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:8px; }
  .seat { text-align:left; background: var(--surface); color: var(--text); border:2px solid var(--line); border-radius:12px; padding:8px; font: inherit; }
  .seat.turn { border-color: var(--accent); }
  .seat.pick { border-style:dashed; border-color: var(--ok); cursor:pointer; }
  .seat.far { opacity:.45; }
  .seat.dead { opacity:.4; }
  .seat .hp { letter-spacing:-2px; }
  .seat small { color: var(--muted); }
  .eqs { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
  .eqs span { font-size:12px; background: var(--surface-2); border-radius:999px; padding:1px 6px; }
  .wc { min-width:74px; min-height:96px; border-radius:10px; border:2px solid var(--line); background: var(--surface); color: var(--text);
        display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:4px; font: inherit; font-size:12px; }
  .wc b { font-size:22px; line-height:1; }
  .wc.sel { border-color: var(--accent); transform: translateY(-6px); }
  .wc .suit { font-size:11px; color: var(--muted); }
  .wc.eq { border-style:dashed; }
  .react { background:#7a1f1f; color:#fff; border-radius:14px; padding:12px; }
  .react .btn { border-color:#fff; }

  /* ---- Khít màn hình: không cuộn trang; bàn tròn co theo chỗ còn trống ---- */
  html, body { height:100%; overflow:hidden; }
  main.wrap { height:100dvh; box-sizing:border-box; display:flex; flex-direction:column; gap:8px;
              padding:8px 12px calc(6px + env(safe-area-inset-bottom)); }
  #app { flex:1; min-height:0; overflow:auto; gap:8px; }
  #app:has(.lz) { overflow:hidden; display:flex; flex-direction:column; }
  #app .rt-layout { flex:1; min-height:0; grid-template-rows:minmax(0,1fr); gap:10px; }
  #app .rt-main { display:flex; flex-direction:column; min-height:0; gap:8px; }
  @media (min-width:1024px) { #app .rt-side { position:static; max-height:none; min-height:0; } }
  .lz { flex:1; min-height:0; container-type:size; }
  .lz-in { height:100%; display:flex; flex-direction:column; gap:8px; }
  .lz-table { flex:1 1 0; min-height:0; container-type:size; display:flex; justify-content:center; align-items:center; }
  .lz-table .rt-stage { width:min(100cqw, 84cqh, 640px); max-width:none; margin:0; container-type:inline-size; }
  .lz-ctrl { flex:none; height:clamp(200px, 38%, 290px); overflow:auto; gap:6px; } /* cao cố định: bàn không co giãn theo nội dung */
  /* Màn hình ngang (máy tính, điện thoại xoay ngang): bàn bên trái, điều khiển bên phải */
  @container (orientation: landscape) and (min-width: 560px) {
    .lz-in { flex-direction:row; }
    .lz-table { flex:1 1 56%; min-width:0; }
    .lz-ctrl { flex:1 1 44%; height:auto; min-width:0; justify-content:center; }
    .lz-in .ov-pop { left:auto; right:0; bottom:auto; top:50%; transform:translateY(-50%); width:min(calc(44% - 8px), 340px); max-height:100%; }
  }
  .lz-ctrl > * { flex-shrink:0; } /* không ép dẹt bài trên tay; thiếu chỗ thì khung điều khiển tự cuộn */
  /* Điện thoại xoay ngang (màn thấp): dồn nút cho bàn tròn rộng chỗ, không ẩn phần nào */
  @media (orientation: landscape) and (max-height: 500px) {
    main.wrap { padding:4px 10px calc(4px + env(safe-area-inset-bottom)); gap:4px; }
    .top { font-size:13px; }
    #app .rt-main { position:relative; }
    #app .rt-toggles { position:absolute; bottom:0; left:0; width:55%; z-index:5; pointer-events:none; } /* góc trên bàn dành cho ô Vai / Nhật ký */
    #app .rt-toggles .btn { pointer-events:auto; padding:4px 10px; }
    #app > .btn-small:last-child { position:fixed; right:10px; top:4px; z-index:5; padding:3px 10px; }
    .lz-table .rt-stage { width:min(100cqw, 86cqh, 640px); }
  }
  /* Ghế, chữ, lá giữa bàn co theo cỡ bàn */
  .lz .rt-seat { width:clamp(62px, 24cqw, 118px); }
  .lz .rt-av { width:clamp(28px, 10cqw, 58px); height:clamp(28px, 10cqw, 58px); font-size:clamp(14px, 4.6cqw, 26px); border-width:2px; }
  .lz .rt-nm { font-size:clamp(10px, 2.4cqw, 12.5px); }
  .lz .rt-sub { font-size:clamp(8.5px, 2cqw, 11px); }
  .lz .rt-eq { width:clamp(14px, 4cqw, 22px); height:clamp(14px, 4cqw, 22px); }
  .lz .rt-eq svg { width:80%; height:80%; }
  .lz .rt-center { gap:4px; padding:4%; }
  .lz .rt-center .ac { width:clamp(34px, 11cqw, 66px); }
  .lz .rt-center .ac.big { width:clamp(42px, 15cqw, 96px); }
  .lz .rt-center .ac .t { font-size:clamp(6px, 1.6cqw, 9.5px); }
  .lz .rt-center .msg { font-size:clamp(9.5px, 2.2cqw, 12.5px); padding:2px 8px; }
  .lz .fan { padding:14px 4px 10px; overflow-y:hidden; justify-content:safe center; scrollbar-width:none; }
  /* Nhiều bài thì xếp chồng sát hơn cho vừa bề ngang (--n: số lá) */
  .lz-ctrl { container-type:inline-size; }
  .lz .fan > * { margin-left:clamp(-46px, calc((100cqw - 40px - var(--n) * 66px) / max(1, var(--n) - 1)), -14px); }
  .lz .fan > *:first-child { margin-left:0; }
  /* Ô nổi mờ trên bàn: vai (góc phải, thu gọn được), nhật ký (góc trái, xổ xuống) */
  .lz-table { position:relative; }
  .ov { position:absolute; top:0; z-index:4; max-width:min(42%, 240px); pointer-events:none; /* chữ cho chạm xuyên xuống ghế bên dưới */ font-size:12px; line-height:1.35; color:var(--text);
        background:rgb(28 22 16 / .62); -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
        border:1px solid rgb(255 255 255 / .14); border-radius:12px; padding:6px 8px; }
  .ov-r { right:0; display:flex; flex-direction:column; gap:4px; padding-right:26px; }
  .ov-l { left:0; padding:0; }
  .ov-btn { font:inherit; font-weight:700; color:var(--text); background:rgb(28 22 16 / .62); border:1px solid rgb(255 255 255 / .14);
            border-radius:12px; padding:5px 10px; cursor:pointer; }
  .ov-l .ov-btn { background:none; border:0; }
  .ov-l ul { margin:0; padding:0 10px 8px 22px; max-height:min(55cqh, 260px); overflow:auto; }
  .ov-l li { margin:2px 0; }
  button.ov, .ov button, .ov ul { pointer-events:auto; } /* nút "🎭 Vai ▾" (thu gọn) cũng phải bấm được */
  /* Khung hành động nổi đè lên vùng điều khiển (dọc: đáy màn hình; ngang: cột phải): bàn giữ nguyên cỡ, không bị che */
  .lz-in { position:relative; }
  .ov-pop { position:absolute; left:50%; bottom:0; transform:translateX(-50%); z-index:6; width:min(100%, 380px); max-height:55%;
            overflow:auto; display:flex; flex-direction:column; gap:6px; font-size:13px; }
  .ov-pop .card-tile { background:rgb(28 22 16 / .84); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
                       box-shadow:0 8px 24px #0009; padding:8px 10px; gap:6px; }
  .ov-pop .actions { gap:6px; }
  .ov-pop .actions .btn { padding:6px 10px; font-size:13px; min-height:0; }
  .ov-pop .ac { width:54px; }
  .ov-pop .ac .t { font-size:8px; }
  .ov-x { position:absolute; top:2px; right:4px; width:22px; height:22px; border-radius:6px; border:0; background:rgb(255 255 255 / .12);
          color:var(--text); font:inherit; font-weight:800; cursor:pointer; }
  .ov-r .btn { align-self:flex-start; padding:3px 10px; font-size:12px; }
  .ov-r small { font-size:11.5px; }
  .rolebar { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px 10px; padding:6px 10px; text-align:center; }
  .rolebar small { font-size:12px; }
  .lz .actions .btn { border-radius:12px; padding:8px 12px; line-height:1.2; }
  .lz .card-tile { padding:10px 12px; }
  /* Viền lá: nâu đậm = lá đánh ngay, xanh dương = trang bị (dày, rõ màu để phân biệt) */
  .ac { border:3px solid #6b3f12; }
  .ac.eq { border-color:#1c7ed6; box-shadow: inset 0 0 0 1.5px #a5d8ff; }
  .ac.back { border-color:#4a3420; box-shadow:none; }
  .gl svg { border:2.5px solid #6b3f12; box-sizing:border-box; }
  .gl.eq svg { border-color:#1c7ed6; }
  .rt-eq { border:2px solid #1c7ed6; cursor:help; -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  /* Chạm giữ lá bài để xem nghĩa */
  .ac { -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  .ac-tip { position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:60;
            width:min(92vw, 360px); background:#f4e6c8; color:#3b2a17; border:2px solid #8a6431; border-radius:12px;
            padding:10px 12px; box-shadow:0 8px 24px #000a; display:flex; gap:10px; align-items:center; pointer-events:none; }
  .ac-tip svg { width:44px; height:44px; flex:none; }
  .ac-tip b { display:block; }
</style>
</head>
<body>
<main class="wrap stack">
  <div class="top"><a href="../">← Trang chủ</a><b>Loạn Đả Viễn Tây</b><span class="net muted" id="net"></span></div>
  <div id="app" class="stack"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
