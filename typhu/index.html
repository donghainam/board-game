<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cờ Tỷ Phú</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏙️</text></svg>">
<link rel="stylesheet" href="../shared/ui.css">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
  :root { --p0:#e03131; --p1:#1c7ed6; --p2:#2f9e44; --p3:#f08c00; --sky:#cfe8f7; --tile:#fbf7f0; --tile-ink:#2a2118; --edge:#a8916c; --grass:#9ccc65; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sky:#1d3445; } }
  :root[data-theme="dark"] { --sky:#1d3445; }
  .wrap { max-width: 980px; }
  /* Sân khấu: bàn cờ xoay 45° và nghiêng 55° (isometric); 4 góc trống đặt thẻ người chơi. Đơn vị cqw = % bề rộng sân khấu. */
  .stage { position:relative; width:100%; aspect-ratio:1.4; container-type:inline-size; background:var(--sky); border-radius:var(--radius); overflow:hidden; }
  .board3d { position:absolute; left:50%; top:53%; width:66cqw; aspect-ratio:1; display:grid; grid-template:repeat(9,1fr)/repeat(9,1fr); gap:.3cqw; padding:.4cqw;
             background:#d9cbb4; border-radius:1.2cqw; transform:translate(-50%,-50%) rotateX(55deg) rotateZ(45deg); transform-style:preserve-3d;
             box-shadow:.4cqw .4cqw 0 var(--edge), .8cqw .8cqw 0 var(--edge), 1.2cqw 1.2cqw 0 #8c7553, 1.6cqw 1.6cqw 1.5cqw rgb(0 0 0 / .25); }
  .field { grid-row:2/9; grid-column:2/9; background:var(--grass); border-radius:.6cqw;
           background-image:linear-gradient(rgb(255 255 255 / .15) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .15) 1px, transparent 1px); background-size:25% 25%; }
  .sq { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.1cqw; min-width:0; min-height:0; overflow:hidden;
        padding:.2cqw; border:0; border-radius:.4cqw; background:var(--tile); color:var(--tile-ink); font:600 clamp(5px,1.15cqw,11px)/1.05 system-ui, sans-serif; text-align:center; cursor:pointer; }
  .sq[style*="--own"] { background:color-mix(in srgb, var(--own) 22%, var(--tile)); box-shadow:inset 0 0 0 .25cqw var(--own); }
  .sq.mort { background:repeating-linear-gradient(45deg,var(--tile) 0 4px,#e2d6c4 4px 8px); }
  .sq.sel { outline:.5cqw solid var(--accent); z-index:1; }
  .sq.corner { background:#f2e6d0; font-size:clamp(6px,1.3cqw,12px); }
  .sq .bar { position:absolute; inset:0 0 auto 0; height:18%; }
  .sq .ic { font-size:clamp(7px,1.8cqw,16px); line-height:1; }
  .sq .ic.big { font-size:clamp(10px,3cqw,28px); }
  .sq .nm { word-break:break-word; margin-top:12%; }
  .sq .ic + .nm, .corner .nm { margin-top:0; }
  .sq .rent { font-weight:800; color:#fff; background:var(--own); border-radius:.4cqw; padding:0 .3cqw; }
  .g1{background:#8d6e63}.g2{background:#4fc3f7}.g3{background:#f06292}.g4{background:#ffb74d}
  .g5{background:#e53935}.g6{background:#fdd835}.g7{background:#43a047}.g8{background:#1e3a8a}
  /* Nhà và quân cờ "đứng" trên ô: xoay ngược lại phép nghiêng của bàn nên luôn quay mặt về người xem. */
  .stand { place-self:center; width:0; height:0; transform:rotateZ(-45deg) rotateX(-55deg); pointer-events:none; }
  .stand .up { position:absolute; left:0; bottom:0; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; white-space:nowrap; line-height:1; }
  .bld { font-size:clamp(9px,2.6cqw,24px); letter-spacing:-.4em; padding-right:.4em; filter:drop-shadow(0 .2cqw 0 rgb(0 0 0 / .25)); }
  .bld.hotel { font-size:clamp(12px,3.4cqw,32px); letter-spacing:0; padding:0; }
  .flag { font-size:clamp(8px,2cqw,18px); }
  .toks { display:flex; gap:.2cqw; }
  .pawn { width:clamp(7px,1.6cqw,14px); height:clamp(12px,2.8cqw,24px); background:var(--c); border:1.5px solid #fff; border-radius:50% 50% 30% 30% / 40% 40% 25% 25%;
          box-shadow:0 .3cqw .4cqw rgb(0 0 0 / .4); }
  .pawn.now { animation:hop 1s ease-in-out infinite; }
  @keyframes hop { 50% { transform:translateY(-30%); } }
  /* Thẻ người chơi ở 4 góc */
  .pcard { position:absolute; display:flex; align-items:center; gap:1cqw; max-width:31cqw; padding:.8cqw 1.4cqw .8cqw .8cqw; background:var(--surface); color:var(--text);
           border-radius:1.6cqw; box-shadow:var(--shadow); border-bottom:.6cqw solid var(--c); font-size:clamp(10px,2cqw,16px); line-height:1.15; }
  .pcard.c0 { left:1.5cqw; top:1.5cqw; } .pcard.c1 { right:1.5cqw; top:1.5cqw; }
  .pcard.c2 { right:1.5cqw; bottom:1.5cqw; } .pcard.c3 { left:1.5cqw; bottom:1.5cqw; }
  .pcard.turn { outline:.5cqw solid var(--c); }
  .pcard.out { opacity:.45; filter:grayscale(1); }
  .pcard .ava { flex:none; display:grid; place-items:center; width:clamp(22px,5.5cqw,48px); aspect-ratio:1; border-radius:22%; background:var(--c); color:#fff; font-weight:800; font-size:1.3em; }
  .pcard .pinfo { display:flex; flex-direction:column; min-width:0; }
  .pcard .pinfo b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* Xúc xắc + thông báo ở giữa sân cỏ */
  .center { position:absolute; left:50%; top:47%; transform:translate(-50%,-50%); width:34cqw; display:flex; flex-direction:column; align-items:center; gap:1cqw; text-align:center; pointer-events:none; }
  .dice { display:flex; gap:2cqw; }
  .die { width:clamp(26px,6.5cqw,56px); aspect-ratio:1; padding:14%; display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); background:#e03131; border-radius:20%;
         box-shadow:inset -.5cqw -.5cqw 0 rgb(0 0 0 / .2), 0 .6cqw .8cqw rgb(0 0 0 / .3); }
  .die i { display:block; }
  .die .pip { background:#fff; border-radius:50%; margin:10%; }
  .die.rolling { animation:tumble .8s ease-out; }
  .dice .die.rolling:nth-child(2) { animation-duration:.7s; }
  @keyframes tumble { 0% { transform:translateY(-120%) rotate(0); } 45% { transform:translateY(0) rotate(300deg); } 70% { transform:translateY(-25%) rotate(420deg); } 100% { transform:none; } }
  .whose { font-size:clamp(11px,2.2cqw,18px); color:#1d3a12; text-shadow:0 1px 0 rgb(255 255 255 / .6); }
  .bubble { background:#fff; color:#2a2118; border-radius:2cqw; padding:.6cqw 1.4cqw; font-size:clamp(10px,1.7cqw,14px); box-shadow:var(--shadow); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .actions .btn { flex:1; min-width:120px; }
  .detail h3 { margin:0; }
  .clock { text-align:center; font: 700 16px ui-monospace, Menlo, Consolas, monospace; }
  @media (prefers-reduced-motion: reduce) { .die.rolling, .pawn.now { animation:none; } }
</style>
</head>
<body>
<main class="wrap stack">
  <div class="top"><a href="../">← Trang chủ</a><b>Cờ Tỷ Phú</b><span class="net muted" id="net"></span></div>
  <div id="app" class="stack"></div>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
